[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "coding-workflows-mcp"
version = "0.1.0"
description = "Bounded, structured agentic coding workflows over MCP"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "mcp==2.0.0",
    "mcp-server-suite-common==0.1.0",
    "pydantic>=2.12,<3",
]

[project.scripts]
coding-workflows = "coding_workflows.server:main"

[tool.uv.sources]
mcp-server-suite-common = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/coding_workflows"]

