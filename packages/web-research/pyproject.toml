[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "web-research-mcp"
version = "0.1.0"
description = "Robots-respecting public web search and extraction over MCP"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "mcp>=2,<3",
    "mcp-server-suite-common==0.1.0",
    "pydantic>=2.12,<3",
]

[project.scripts]
web-research = "web_research.server:main"

[tool.uv.sources]
mcp-server-suite-common = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/web_research"]

