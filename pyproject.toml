[project]
name = "prathamesh-mcp-servers-workspace"
version = "0.1.0"
description = "Six bounded, typed MCP servers for research, recruiting, and coding workflows"
requires-python = ">=3.11"
dependencies = [
    "ats-jobs-mcp",
    "coding-workflows-mcp",
    "grounded-cv-mcp",
    "outcome-ledger-mcp",
    "repo-intel-mcp",
    "web-research-mcp",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25,<2",
    "pytest-socket>=0.7,<1",
    "ruff>=0.11,<1",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
ats-jobs-mcp = { workspace = true }
coding-workflows-mcp = { workspace = true }
grounded-cv-mcp = { workspace = true }
outcome-ledger-mcp = { workspace = true }
repo-intel-mcp = { workspace = true }
web-research-mcp = { workspace = true }

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --disable-socket --allow-hosts=127.0.0.1,localhost,::1"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF", "SIM", "PTH"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
